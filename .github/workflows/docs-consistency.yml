name: docs-consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-consistency:
    name: docs-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SoT, register, decision records and frozen files agree
        run: python3 tools/check_docs_consistency.py --check
